<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <pattern id="hatchT" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1c1912" stroke-width="1"/>
    </pattern>
    <pattern id="hatchT2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1912" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- ground -->
  <line x1="30" y1="270" x2="370" y2="270" stroke="#1c1912" stroke-width="3"/>
  <rect x="30" y="270" width="340" height="8" fill="url(#hatchT2)"/>

  <!-- toolbox body -->
  <path d="M78 190 h244 v70 h-244 z" fill="url(#hatchT)" stroke="#1c1912" stroke-width="4"/>
  <path d="M78 190 h244 v18 h-244 z" fill="#efe7d3" stroke="#1c1912" stroke-width="3"/>

  <!-- plank lines -->
  <line x1="78" y1="228" x2="322" y2="228" stroke="#1c1912" stroke-width="2"/>
  <line x1="78" y1="246" x2="322" y2="246" stroke="#1c1912" stroke-width="2"/>

  <!-- handle -->
  <path d="M158 190 v-26 a42 30 0 0 1 84 0 v26" fill="none" stroke="#1c1912" stroke-width="5"/>

  <!-- clasp -->
  <rect x="188" y="200" width="24" height="16" fill="#efe7d3" stroke="#1c1912" stroke-width="3"/>
  <circle cx="200" cy="208" r="2.4" fill="#1c1912"/>

  <!-- nameplate -->
  <rect x="118" y="234" width="72" height="20" fill="#efe7d3" stroke="#1c1912" stroke-width="2"/>
  <text x="154" y="249" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="700" fill="#1c1912" text-anchor="middle" letter-spacing="1">DEV TOOLS</text>

  <!-- wrench crossing the top -->
  <g transform="translate(150,150) rotate(-32)">
    <rect x="-6" y="-46" width="12" height="70" fill="#efe7d3" stroke="#1c1912" stroke-width="3"/>
    <path d="M-14 -46 a14 14 0 1 1 28 0 a14 6 0 0 1 -28 0 z" fill="#efe7d3" stroke="#1c1912" stroke-width="3"/>
    <path d="M-6 24 h12 v10 h-12 z" fill="#efe7d3" stroke="#1c1912" stroke-width="3"/>
  </g>

  <!-- screwdriver crossing the top -->
  <g transform="translate(232,150) rotate(28)">
    <rect x="-5" y="-14" width="10" height="60" fill="#efe7d3" stroke="#1c1912" stroke-width="3"/>
    <path d="M-5 -14 l5 -34 l5 34 z" fill="url(#hatchT)" stroke="#1c1912" stroke-width="3"/>
    <rect x="-9" y="46" width="18" height="26" rx="3" fill="url(#hatchT)" stroke="#1c1912" stroke-width="3"/>
  </g>

  <!-- small gear on the box -->
  <g transform="translate(280,216)" stroke="#1c1912" stroke-width="2" fill="#efe7d3">
    <circle r="12"/>
    <g stroke-width="2.4">
      <line x1="0" y1="-12" x2="0" y2="-17"/>
      <line x1="0" y1="12" x2="0" y2="17"/>
      <line x1="-12" y1="0" x2="-17" y2="0"/>
      <line x1="12" y1="0" x2="17" y2="0"/>
      <line x1="-8.5" y1="-8.5" x2="-12" y2="-12"/>
      <line x1="8.5" y1="8.5" x2="12" y2="12"/>
      <line x1="-8.5" y1="8.5" x2="-12" y2="12"/>
      <line x1="8.5" y1="-8.5" x2="12" y2="-12"/>
    </g>
    <circle r="4" fill="#1c1912"/>
  </g>
</svg>
