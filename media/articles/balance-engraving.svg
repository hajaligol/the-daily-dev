<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <pattern id="hatchB" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1c1912" stroke-width="1"/>
    </pattern>
    <pattern id="hatchB2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1912" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- base -->
  <line x1="70" y1="270" x2="330" y2="270" stroke="#1c1912" stroke-width="3"/>
  <rect x="70" y="270" width="260" height="8" fill="url(#hatchB2)"/>
  <path d="M172 270 h56 l-10 -18 h-36 z" fill="url(#hatchB)" stroke="#1c1912" stroke-width="3"/>

  <!-- upright post -->
  <rect x="196" y="90" width="8" height="164" fill="#efe7d3" stroke="#1c1912" stroke-width="3"/>

  <!-- fulcrum finial -->
  <circle cx="200" cy="82" r="9" fill="#efe7d3" stroke="#1c1912" stroke-width="3"/>

  <!-- beam -->
  <line x1="100" y1="100" x2="300" y2="100" stroke="#1c1912" stroke-width="5"/>
  <circle cx="200" cy="100" r="6" fill="#1c1912"/>

  <!-- left chains -->
  <line x1="100" y1="100" x2="80" y2="160" stroke="#1c1912" stroke-width="2"/>
  <line x1="100" y1="100" x2="120" y2="160" stroke="#1c1912" stroke-width="2"/>
  <!-- left pan -->
  <path d="M68 160 h64 a32 14 0 0 1 -64 0 z" fill="url(#hatchB)" stroke="#1c1912" stroke-width="3"/>

  <!-- right chains -->
  <line x1="300" y1="100" x2="280" y2="150" stroke="#1c1912" stroke-width="2"/>
  <line x1="300" y1="100" x2="320" y2="150" stroke="#1c1912" stroke-width="2"/>
  <!-- right pan -->
  <path d="M268 150 h64 a32 14 0 0 1 -64 0 z" fill="url(#hatchB)" stroke="#1c1912" stroke-width="3"/>

  <!-- laptop on left pan (heavier side, tipped down) -->
  <g transform="translate(100,152)">
    <path d="M-24 4 h48 v20 h-48 z" fill="#efe7d3" stroke="#1c1912" stroke-width="2.5"/>
    <path d="M-28 24 h56 l6 8 h-68 z" fill="#efe7d3" stroke="#1c1912" stroke-width="2.5"/>
    <line x1="-16" y1="12" x2="14" y2="12" stroke="#1c1912" stroke-width="2"/>
    <line x1="-16" y1="18" x2="6" y2="18" stroke="#1c1912" stroke-width="2"/>
  </g>

  <!-- small potted plant on right pan (lighter side, up) -->
  <g transform="translate(300,130)">
    <path d="M-14 8 h28 l-4 16 h-20 z" fill="url(#hatchB)" stroke="#1c1912" stroke-width="2.5"/>
    <path d="M0 8 C-2 -4 4 -10 0 -22" fill="none" stroke="#1c1912" stroke-width="2.5"/>
    <path d="M0 -6 C-10 -10 -12 -18 -6 -24 C2 -20 4 -12 0 -6 Z" fill="#efe7d3" stroke="#1c1912" stroke-width="2"/>
    <path d="M0 -14 C10 -18 12 -26 6 -32 C-2 -28 -4 -20 0 -14 Z" fill="#efe7d3" stroke="#1c1912" stroke-width="2"/>
  </g>

  <!-- word BALANCE on base plinth -->
  <text x="200" y="264" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="13" letter-spacing="2.5" fill="#efe7d3" text-anchor="middle">BALANCE</text>
</svg>
