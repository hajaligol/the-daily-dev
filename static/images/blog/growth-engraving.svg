<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <pattern id="hatchG" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1c1912" stroke-width="1"/>
    </pattern>
    <pattern id="hatchG2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1912" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- ground -->
  <line x1="40" y1="266" x2="360" y2="266" stroke="#1c1912" stroke-width="3"/>
  <rect x="40" y="266" width="320" height="8" fill="url(#hatchG2)"/>

  <!-- stack of books -->
  <g stroke="#1c1912" stroke-width="3">
    <rect x="110" y="228" width="180" height="30" fill="url(#hatchG)"/>
    <rect x="122" y="198" width="156" height="30" fill="#efe7d3"/>
    <rect x="112" y="168" width="176" height="30" fill="url(#hatchG)"/>
  </g>
  <text x="200" y="249" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="14" letter-spacing="2" fill="#1c1912" text-anchor="middle">REPEAT</text>
  <text x="200" y="219" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="14" letter-spacing="2" fill="#1c1912" text-anchor="middle">SHIP</text>
  <text x="200" y="189" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="14" letter-spacing="2" fill="#1c1912" text-anchor="middle">BUILD</text>

  <!-- pot resting on top of books -->
  <path d="M172 168 L228 168 L220 146 L180 146 Z" fill="url(#hatchG)" stroke="#1c1912" stroke-width="3"/>
  <line x1="176" y1="152" x2="224" y2="152" stroke="#1c1912" stroke-width="2"/>

  <!-- plant stem -->
  <path d="M200 146 C198 118 204 96 200 70" fill="none" stroke="#1c1912" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M200 120 C186 112 176 118 168 108" fill="none" stroke="#1c1912" stroke-width="3"/>
  <path d="M200 96 C214 88 224 92 232 82" fill="none" stroke="#1c1912" stroke-width="3"/>

  <!-- leaves -->
  <g stroke="#1c1912" stroke-width="2.5">
    <path d="M168 108 C158 98 158 84 172 78 C178 92 180 102 168 108 Z" fill="url(#hatchG)"/>
    <path d="M232 82 C244 74 246 60 234 52 C224 64 220 74 232 82 Z" fill="url(#hatchG)"/>
    <path d="M200 70 C192 54 198 40 214 34 C220 52 216 64 200 70 Z" fill="#efe7d3"/>
    <path d="M200 70 C208 54 202 40 186 36 C180 54 184 64 200 70 Z" fill="url(#hatchG)"/>
  </g>

  <!-- little sparkle marks -->
  <g stroke="#1c1912" stroke-width="2" stroke-linecap="round">
    <path d="M260 60 v14 M253 67 h14"/>
    <path d="M118 78 v10 M113 83 h10"/>
  </g>
</svg>
