<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <pattern id="hatchD" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1c1912" stroke-width="1"/>
    </pattern>
    <pattern id="hatchD2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1c1912" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- desk surface -->
  <line x1="20" y1="272" x2="380" y2="272" stroke="#1c1912" stroke-width="3"/>
  <rect x="20" y="272" width="360" height="10" fill="url(#hatchD2)"/>

  <!-- mug -->
  <g>
    <path d="M56 224 h44 v34 a22 22 0 0 1 -44 0 z" fill="url(#hatchD)" stroke="#1c1912" stroke-width="3"/>
    <path d="M100 232 q22 0 22 16 q0 16 -22 16" fill="none" stroke="#1c1912" stroke-width="3"/>
    <path d="M64 214 q4 -10 -2 -18" fill="none" stroke="#1c1912" stroke-width="2"/>
    <path d="M78 214 q4 -12 -3 -20" fill="none" stroke="#1c1912" stroke-width="2"/>
    <path d="M92 214 q4 -10 -2 -18" fill="none" stroke="#1c1912" stroke-width="2"/>
  </g>

  <!-- laptop base -->
  <path d="M140 262 L260 262 L280 282 L120 282 Z" fill="#efe7d3" stroke="#1c1912" stroke-width="3"/>
  <line x1="150" y1="270" x2="250" y2="270" stroke="#1c1912" stroke-width="1.5"/>

  <!-- laptop screen -->
  <path d="M148 148 h104 v114 h-104 z" fill="#efe7d3" stroke="#1c1912" stroke-width="4"/>
  <path d="M158 160 h84 v90 h-84 z" fill="#efe7d3" stroke="#1c1912" stroke-width="2"/>

  <!-- code lines on screen -->
  <line x1="166" y1="174" x2="206" y2="174" stroke="#1c1912" stroke-width="3"/>
  <line x1="166" y1="186" x2="228" y2="186" stroke="#1c1912" stroke-width="3"/>
  <line x1="174" y1="198" x2="220" y2="198" stroke="#1c1912" stroke-width="3"/>
  <line x1="166" y1="210" x2="200" y2="210" stroke="#1c1912" stroke-width="3"/>
  <line x1="166" y1="234" x2="192" y2="234" stroke="#1c1912" stroke-width="3"/>

  <!-- bug on screen -->
  <g transform="translate(214,214) rotate(18)">
    <ellipse cx="0" cy="0" rx="11" ry="15" fill="url(#hatchD)" stroke="#1c1912" stroke-width="2.5"/>
    <line x1="0" y1="-15" x2="0" y2="15" stroke="#1c1912" stroke-width="1.5"/>
    <line x1="-11" y1="-6" x2="-19" y2="-12" stroke="#1c1912" stroke-width="2"/>
    <line x1="-11" y1="0" x2="-20" y2="0" stroke="#1c1912" stroke-width="2"/>
    <line x1="-11" y1="6" x2="-19" y2="12" stroke="#1c1912" stroke-width="2"/>
    <line x1="11" y1="-6" x2="19" y2="-12" stroke="#1c1912" stroke-width="2"/>
    <line x1="11" y1="0" x2="20" y2="0" stroke="#1c1912" stroke-width="2"/>
    <line x1="11" y1="6" x2="19" y2="12" stroke="#1c1912" stroke-width="2"/>
    <circle cx="-4" cy="-13" r="2" fill="#1c1912"/>
    <circle cx="4" cy="-13" r="2" fill="#1c1912"/>
  </g>

  <!-- magnifying glass -->
  <g>
    <circle cx="256" cy="196" r="34" fill="#efe7d3" fill-opacity="0.55" stroke="#1c1912" stroke-width="5"/>
    <line x1="280" y1="220" x2="312" y2="252" stroke="#1c1912" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
